# Aplica las migraciones pendientes (y opcionalmente despliega las Edge
# Functions) en TODOS los clientes, para que todos tengan la misma versión.
# - Solo a mano: pestaña Actions → "Actualizar clientes" → Run workflow.
#   No corre solo al hacer merge: algunas migraciones deben esperar a que
#   Netlify publique la app nueva (lo dice el encabezado de cada migración).
# Necesita el secret SUPABASE_ACCESS_TOKEN y la variable CLIENTES
# (Settings → Secrets and variables → Actions).
name: Actualizar clientes

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo listar lo pendiente, sin aplicar nada'
        type: boolean
        default: true
      funciones:
        description: 'También desplegar las Edge Functions'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: actualizar-clientes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Migraciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLIENTES: ${{ vars.CLIENTES }}
          PRUEBA: ${{ github.event.inputs.prueba }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$CLIENTES" ]; then
            echo "::error::Faltan el secret SUPABASE_ACCESS_TOKEN o la variable CLIENTES."
            exit 1
          fi
          node scripts/clientes.mjs estado
          if [ "$PRUEBA" = "true" ]; then
            node scripts/clientes.mjs migrar --prueba
          else
            node scripts/clientes.mjs migrar
          fi
      - name: Edge Functions
        if: ${{ github.event.inputs.funciones == 'true' && github.event.inputs.prueba != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLIENTES: ${{ vars.CLIENTES }}
        run: node scripts/clientes.mjs funciones
