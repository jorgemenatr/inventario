# Respaldo de todos los clientes (los de src/tenants.json), en un archivo CIFRADO:
# - Diario: la base completa (pg_dump: ventas, inventario, clientes, usuarios…).
#   Se guarda 14 días.
# - Domingos: la base y además las fotos de productos. Se guarda 35 días.
# - También a mano: pestaña Actions → "Respaldo de clientes" → Run workflow.
#
# El repositorio es público: cualquiera con cuenta de GitHub puede bajar los
# artifacts. Por eso el respaldo SIEMPRE va cifrado con BACKUP_PASSPHRASE, y
# si falta, no se sube nada. Cómo restaurar: docs/RESPALDOS.md.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  el mismo de "Actualizar clientes"
#   BACKUP_PASSPHRASE      contraseña larga para cifrar; guárdala fuera de GitHub
name: Respaldo de clientes

on:
  schedule:
    - cron: '41 8 * * *' # diario 08:41 UTC (02:41 en CDMX)
  workflow_dispatch:
    inputs:
      fotos:
        description: 'Incluir las fotos de productos'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Revisar secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets SUPABASE_ACCESS_TOKEN o BACKUP_PASSPHRASE."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE debe tener al menos 16 caracteres."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # pg_dump debe ser de la misma versión que la base o más nueva (Supabase: 17).
      - name: Instalar pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # Fotos: los domingos (programado) o si se pide a mano.
      - name: Elegir tipo de respaldo
        env:
          FOTOS_MANUAL: ${{ github.event.inputs.fotos }}
        run: |
          if [ "$FOTOS_MANUAL" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; }; then
            echo "TIPO=completo" >> "$GITHUB_ENV"
            echo "RETENCION=35" >> "$GITHUB_ENV"
          else
            echo "TIPO=base" >> "$GITHUB_ENV"
            echo "RETENCION=14" >> "$GITHUB_ENV"
          fi
      - name: Respaldar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pg_dump --version
          if [ "$TIPO" = "completo" ]; then
            node scripts/clientes.mjs respaldo --dir respaldos
          else
            node scripts/clientes.mjs respaldo --dir respaldos --sin-fotos
          fi
      # Aunque un cliente falle, se sube lo que sí se respaldó (la corrida queda en rojo).
      - name: Cifrar
        if: ${{ !cancelled() && hashFiles('respaldos/**') != '' }}
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE="respaldo-$TIPO-$(date -u +%Y-%m-%d).tar.gz.gpg"
          tar -czf - respaldos | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output "$FILE" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf respaldos
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "Respaldo cifrado ($TIPO, se guarda $RETENCION días): $FILE ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.FILE != '' }}
        with:
          name: respaldo-${{ env.TIPO }}
          path: ${{ env.FILE }}
          retention-days: ${{ env.RETENCION }}
          if-no-files-found: error
