# Respaldo de todos los clientes (los de src/tenants.json): la base completa
# (pg_dump) y las fotos de productos, en un archivo CIFRADO.
# - Corre solo cada domingo.
# - También a mano: pestaña Actions → "Respaldo de clientes" → Run workflow.
# - Se guarda como artifact de la corrida durante 35 días.
#
# El repositorio es público: cualquiera con cuenta de GitHub puede bajar los
# artifacts. Por eso el respaldo SIEMPRE va cifrado con BACKUP_PASSPHRASE, y
# si falta, no se sube nada. Cómo restaurar: docs/RESPALDOS.md.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  el mismo de "Actualizar clientes"
#   BACKUP_PASSPHRASE      contraseña larga para cifrar; guárdala fuera de GitHub
name: Respaldo de clientes

on:
  schedule:
    - cron: '41 8 * * 0' # domingo 08:41 UTC (02:41 en CDMX)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Revisar secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets SUPABASE_ACCESS_TOKEN o BACKUP_PASSPHRASE."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE debe tener al menos 16 caracteres."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # pg_dump debe ser de la misma versión que la base o más nueva (Supabase: 17).
      - name: Instalar pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Respaldar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pg_dump --version
          node scripts/clientes.mjs respaldo --dir respaldos
      # Aunque un cliente falle, se sube lo que sí se respaldó (la corrida queda en rojo).
      - name: Cifrar
        if: ${{ !cancelled() && hashFiles('respaldos/**') != '' }}
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE="respaldo-$(date -u +%Y-%m-%d).tar.gz.gpg"
          tar -czf - respaldos | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output "$FILE" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf respaldos
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "Respaldo cifrado: $FILE ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.FILE != '' }}
        with:
          name: respaldo
          path: ${{ env.FILE }}
          retention-days: 35
          if-no-files-found: error
